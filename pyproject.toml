[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xcp-platform"
version = "0.1.0"
description = "Contracts and reference tools for deterministic software adaptation and verified execution"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.21,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
xcp = "xcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xcp = ["spec/*.json", "conformance/vectors/*.json", "conformance/godot_fixture/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
